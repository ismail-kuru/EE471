<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech-to-Text</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="card">
    <h1>🎙️ Speech-to-Text</h1>
    <p class="subtitle">Powered by Azure Cognitive Services</p>

    <label>Record or upload audio to convert to text:</label>
    <div class="record-row">
      <button type="button" class="button primary" id="stt-start">🎙️ Start Recording</button>
      <button type="button" class="button danger" id="stt-stop" disabled>⏹ Stop Recording</button>
      <input type="file" id="stt-file" accept="audio/*">
    </div>

    <label for="stt-language">Language:</label>
    <select id="stt-language">
      {% for value, label in languages.items() %}
      <option value="{{ value }}" {% if value == default_language %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>

    <p id="stt-recording" class="status recording" hidden>● Recording…</p>
    <audio id="stt-preview" controls hidden></audio>

    <div class="button-row">
      <button type="button" class="button primary" id="stt-transcribe">📝 Transcribe Audio</button>
      <button type="button" class="button secondary" id="stt-clear">Clear</button>
    </div>

    <section id="stt-result" class="result transcript" hidden>
      <h2>Transcription:</h2>
      <p id="stt-text" class="transcript-text"></p>
      <button type="button" class="button secondary small" id="stt-copy">📋 Copy Text</button>
    </section>

    <p id="stt-status" class="status" hidden></p>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
