<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cat Classifier</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="panel">
    <h1>Cat Classifier</h1>
    <p class="intro">Upload a photo of a cat to find out what kind it is.</p>

    <form id="form">
      <label class="file-button">
        Choose image
        <input type="file" id="image" accept="image/*">
      </label>
      <span id="file-name" class="file-name">No image chosen</span>

      <img id="preview" class="preview" alt="The chosen image" hidden>

      <button type="submit" id="classify" class="classify" disabled>Classify</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>

    <section id="result" class="result" aria-live="polite" hidden>
      <p id="result-label" class="result-label"></p>
      <h2 id="result-class"></h2>
      <p id="result-confidence" class="result-confidence"></p>
      <ul id="kinds" class="kinds"></ul>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
