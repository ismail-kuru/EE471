<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="calculator">
    <output id="display" class="display" aria-live="polite">0</output>
    <div class="keys">
      <button class="key digit" data-digit="7">7</button>
      <button class="key digit" data-digit="8">8</button>
      <button class="key digit" data-digit="9">9</button>
      <button class="key operator" data-operation="divide">÷</button>

      <button class="key digit" data-digit="4">4</button>
      <button class="key digit" data-digit="5">5</button>
      <button class="key digit" data-digit="6">6</button>
      <button class="key operator" data-operation="multiply">×</button>

      <button class="key digit" data-digit="1">1</button>
      <button class="key digit" data-digit="2">2</button>
      <button class="key digit" data-digit="3">3</button>
      <button class="key operator" data-operation="subtract">−</button>

      <button class="key digit" data-digit="0">0</button>
      <button class="key digit" data-digit=".">.</button>
      <button class="key equals" id="equals">=</button>
      <button class="key operator" data-operation="add">+</button>
    </div>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
