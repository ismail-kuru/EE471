build:
  python_version: "3.12"
  python_requirements: requirements.txt
  run:
    # Store MediaPipe's face model in the image, so the container never has to download it.
    - mkdir -p /opt/models && curl -sSfL -o /opt/models/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task
run: "run.py:Runner"
