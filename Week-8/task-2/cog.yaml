build:
  python_version: "3.12"
  python_requirements: requirements.txt
  run:
    # Store MediaPipe's pose model in the image, so the container never has to download it.
    - mkdir -p /opt/models && curl -sSfL -o /opt/models/pose_landmarker_full.task https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/latest/pose_landmarker_full.task
run: "run.py:Runner"
